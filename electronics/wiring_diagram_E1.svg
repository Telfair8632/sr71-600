<rect x="275" y="290" width="175" height="24" rx="8" fill="#d46a1f"/>
<text x="283" y="307" class="title">Power star point PDB</text>
<text x="283" y="334" class="body">XT30, dual ESCs, UBEC</text>
<text x="283" y="349" class="body">Power current never enters the perfboard</text>
<rect x="525" y="155" width="190" height="95" rx="8" fill="#f6fafc" stroke="#b9cbd5"/>
